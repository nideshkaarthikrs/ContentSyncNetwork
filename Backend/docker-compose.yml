# Runs all 13 CSN backend services + their Postgres DBs + an nginx gateway
# behind a single published port, so hosting only has to expose one port
# instead of 13. Service code is unchanged: every *_SERVICE_URL and
# DATABASE_URL env var was already overridable (see each service's
# src/config/configuration.ts), so this file just points them at the other
# containers' Docker-DNS names instead of localhost.
#
# Usage:
#   Production-style (built images):      docker compose up -d --build
#   Local dev (hot reload, add override):  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Secrets (JWT_SECRET, INTERNAL_SERVICE_SECRET, DB creds, etc.) come from each
# service's own .env file (env_file: below) -- nothing secret lives in this
# file, so it's safe to commit.

x-postgres-defaults: &postgres-defaults
  image: postgres:16-alpine
  networks: [csn-net]
  restart: unless-stopped

x-app-defaults: &app-defaults
  networks: [csn-net]
  restart: unless-stopped

x-migrate-defaults: &migrate-defaults
  networks: [csn-net]
  restart: "no"
  command: ["npx", "prisma", "migrate", "deploy"]

services:
  # ---------------------------------------------------------------- identity
  identity-db:
    <<: *postgres-defaults
    environment:
      POSTGRES_USER: csn
      POSTGRES_PASSWORD: csn_pass
      POSTGRES_DB: csn_identity
    volumes:
      - identity_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csn -d csn_identity"]
      interval: 5s
      timeout: 5s
      retries: 10

  identity-migrate:
    <<: *migrate-defaults
    build: { context: ./identity-service, target: builder }
    env_file: ./identity-service/.env
    environment:
      DATABASE_URL: postgresql://csn:csn_pass@identity-db:5432/csn_identity
    depends_on:
      identity-db: { condition: service_healthy }

  identity-service:
    <<: *app-defaults
    build: { context: ./identity-service }
    env_file: ./identity-service/.env
    environment:
      DATABASE_URL: postgresql://csn:csn_pass@identity-db:5432/csn_identity
    depends_on:
      identity-migrate: { condition: service_completed_successfully }
    expose: ["3001"]

