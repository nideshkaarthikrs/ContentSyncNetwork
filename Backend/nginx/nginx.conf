worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # Docker's embedded DNS server. Resolving through a variable (rather than a
  # bare proxy_pass hostname) forces nginx to re-resolve at request time
  # instead of caching each service's IP forever after the first lookup --
  # otherwise restarting a single backend container (which gets a new IP)
  # would require restarting nginx too. NOTE: once proxy_pass's target is a
  # variable, nginx stops doing its usual "strip the matched location prefix"
  # rewrite -- it forwards $request_uri as-is instead. So every location
  # below does the prefix-stripping itself via `rewrite ... break` and then
  # rebuilds the upstream URI from the rewritten $uri.
  resolver 127.0.0.11 valid=10s;

  # tune/voice/video/project services accept multipart audio & video uploads.
  client_max_body_size 200M;
  proxy_read_timeout 120s;
  proxy_send_timeout 120s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # chat-service's Socket.IO gateway (path set to /chat/socket.io -- see
    # message.gateway.ts) needs the WS upgrade headers and must NOT have its
    # /chat prefix stripped, since the socket server's own path already
    # includes it -- so this one deliberately passes $request_uri through.
    location /chat/socket.io/ {
      set $chat_ws http://chat-service:3008;
      proxy_pass $chat_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }

    # Internal service-to-service routes (guarded by InternalAuthGuard /
    # x-internal-secret) must never be reachable from outside the cluster --
    # block them at the gateway before any prefix location can proxy them
    # through. A regex location always wins over a prefix location match
    # (nginx tries regex locations before falling back to the longest
    # prefix), so this is effective regardless of placement, but it's kept
    # here -- before the prefix locations below -- for readability. Does not
    # affect /chat/socket.io/ (no "internal" segment).
    location ~ ^/[a-z]+/internal(/|$) {
      return 404;
    }

    location /identity/ {
      set $upstream http://identity-service:3001;
      rewrite ^/identity/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /profile/ {
      set $upstream http://profile-service:3002;
      rewrite ^/profile/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /tune/ {
      set $upstream http://tune-service:3003;
      rewrite ^/tune/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /lyrics/ {
      set $upstream http://lyrics-service:3004;
      rewrite ^/lyrics/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /voice/ {
      set $upstream http://voice-service:3005;
      rewrite ^/voice/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /video/ {
      set $upstream http://video-service:3006;
      rewrite ^/video/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /project/ {
      set $upstream http://project-service:3007;
      rewrite ^/project/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    # REST routes for chat-service (the socket.io location above handles WS).
    location /chat/ {
      set $upstream http://chat-service:3008;
      rewrite ^/chat/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /voting/ {
      set $upstream http://voting-service:3009;
      rewrite ^/voting/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /feed/ {
      set $upstream http://feed-service:3010;
      rewrite ^/feed/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /rights/ {
      set $upstream http://rights-service:3011;
      rewrite ^/rights/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /payment/ {
      set $upstream http://payment-service:3012;
      rewrite ^/payment/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }

    location /notification/ {
      set $upstream http://notification-service:3013;
      rewrite ^/notification/(.*)$ /$1 break;
      proxy_pass $upstream$uri$is_args$args;
    }
  }
}
